[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlearn-rag"
version = "0.1.0"
description = "Source-grounded VLearn RAG with OpenRouter embeddings"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "pydantic>=2.9,<3", "python-dotenv>=1,<2", "pymupdf>=1.25,<2",
  "qdrant-client>=1.14,<2", "rank-bm25>=0.2.2,<0.3",
  "tiktoken>=0.9,<1", "tokenizers>=0.21,<1", "filelock>=3.16,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
vlearn = "vlearn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vlearn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
